<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈默</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Space+Mono:wght@400;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
--bg: #0a0a0a;
--surface: #111111;
--border: #1e1e1e;
--text: #d4d0c8;
--text-dim: #4a4a4a;
--accent: #c8b89a;
--accent-dim: #3a3228;
--him: #1a1a1a;
--me: #141414;
--warn: #7a6a3a;
--danger: #8b3a3a;
}

body {
background: var(–-bg); color: var(–-text);
font-family: ‘Noto Serif SC’, serif;
height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}

/* 点歌横幅 */
#song-banner {
display: none;
position: fixed; top: 0; left: 0; right: 0;
background: #1a1612;
border-bottom: 1px solid var(–accent);
padding: 12px 24px; z-index: 100;
align-items: center; gap: 12px;
animation: slideDown 0.3s ease;
}
#song-banner.visible { display: flex; }
@keyframes slideDown {
from { transform: translateY(-100%); }
to { transform: translateY(0); }
}
.banner-text { flex: 1; font-size: 13px; color: var(–accent); }
.banner-sub { font-size: 10px; color: var(–text-dim); font-family: ‘Space Mono’, monospace; margin-top: 2px; }
#banner-play {
background: transparent; border: 1px solid var(–accent);
color: var(–accent); font-family: ‘Space Mono’, monospace;
font-size: 10px; padding: 6px 14px; cursor: pointer; border-radius: 4px;
white-space: nowrap;
}
#banner-dismiss {
background: transparent; border: none;
color: var(–text-dim); cursor: pointer; font-size: 16px; padding: 0 4px;
}

header {
padding: 20px 24px 16px; border-bottom: 1px solid var(–border);
display: flex; align-items: flex-end; gap: 16px; flex-shrink: 0;
}

.avatar {
width: 36px; height: 36px; border-radius: 50%;
background: var(–accent-dim); border: 1px solid var(–accent);
display: flex; align-items: center; justify-content: center;
font-family: ‘Space Mono’, monospace; font-size: 12px; color: var(–accent); flex-shrink: 0;
}

.header-info { flex: 1; }
.name { font-family: ‘Space Mono’, monospace; font-size: 13px; color: var(–accent); letter-spacing: 0.1em; }
.status { font-size: 11px; color: var(–text-dim); margin-top: 2px; font-family: ‘Space Mono’, monospace; }
.status.online::before { content: ’● ’; color: #4a7a4a; }

#turn-counter { font-family: ‘Space Mono’, monospace; font-size: 10px; color: var(–text-dim); text-align: right; line-height: 1.5; }
#turn-counter .turn-num { font-size: 16px; color: var(–text-dim); display: block; transition: color 0.3s; }
#turn-counter.warn .turn-num { color: var(–warn); }
#turn-counter.danger .turn-num { color: var(–danger); }

#activity-bar {
padding: 10px 24px; border-bottom: 1px solid var(–border);
font-family: ‘Space Mono’, monospace; font-size: 10px; color: var(–text-dim);
flex-shrink: 0; min-height: 36px; display: flex; align-items: center; gap: 8px; overflow: hidden;
}
.activity-label { color: var(–accent-dim); border: 1px solid var(–accent-dim); padding: 1px 6px; font-size: 9px; flex-shrink: 0; }
.activity-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 备忘条 */
#memo-bar {
display: none;
padding: 8px 24px; border-bottom: 1px solid var(–border);
font-family: ‘Space Mono’, monospace; font-size: 10px; color: var(–text-dim);
flex-shrink: 0; align-items: center; gap: 8px; overflow: hidden;
background: #0d0d0d;
}
#memo-bar.visible { display: flex; }
.memo-label { color: #5a4a3a; border: 1px solid #3a2a1a; padding: 1px 6px; font-size: 9px; flex-shrink: 0; }
.memo-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #6a5a4a; }

#now-playing {
display: none; padding: 8px 24px; border-bottom: 1px solid var(–border);
background: var(–surface); flex-shrink: 0; align-items: center; gap: 10px;
}
#now-playing.visible { display: flex; }
.np-info { flex: 1; overflow: hidden; }
.np-name { font-size: 12px; color: var(–accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 10px; color: var(–text-dim); font-family: ‘Space Mono’, monospace; margin-top: 2px; }
.np-controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.np-btn { background: transparent; border: none; color: var(–text-dim); cursor: pointer; font-size: 14px; padding: 2px 4px; transition: color 0.2s; }
.np-btn:hover { color: var(–accent); }
.np-progress { width: 80px; height: 2px; background: var(–border); border-radius: 1px; flex-shrink: 0; cursor: pointer; position: relative; }
.np-progress-fill { height: 100%; background: var(–accent); border-radius: 1px; width: 0%; transition: width 0.5s linear; pointer-events: none; }

#messages {
flex: 1; overflow-y: auto; padding: 24px 24px 0;
display: flex; flex-direction: column; gap: 20px;
scrollbar-width: thin; scrollbar-color: var(–border) transparent;
}
#messages::-webkit-scrollbar { width: 3px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(–border); }

.msg { display: flex; flex-direction: column; max-width: 75%; animation: fadeUp 0.3s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.him { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 12px 16px; font-size: 14px; line-height: 1.7; border: 1px solid var(–border); }
.msg.him .bubble { background: var(–him); border-color: var(–border); color: var(–text); border-radius: 0 8px 8px 8px; }
.msg.me .bubble { background: var(–me); border-color: var(–accent-dim); color: var(–text); border-radius: 8px 0 8px 8px; }
.time { font-family: ‘Space Mono’, monospace; font-size: 9px; color: var(–text-dim); margin-top: 4px; padding: 0 2px; }
.msg.system { align-self: center; max-width: 90%; }
.msg.system .bubble { background: transparent; border-color: var(–warn); color: var(–warn); border-radius: 4px; font-family: ‘Space Mono’, monospace; font-size: 11px; text-align: center; padding: 8px 16px; }
.msg.system.danger .bubble { border-color: var(–danger); color: var(–danger); }

#music-panel {
display: none; border-top: 1px solid var(–border);
background: var(–surface); flex-shrink: 0; flex-direction: column; max-height: 260px;
}
#music-panel.open { display: flex; }
.music-search-row { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(–border); }
#music-search-input {
flex: 1; background: var(–bg); border: 1px solid var(–border);
color: var(–text); font-family: ‘Noto Serif SC’, serif;
font-size: 13px; padding: 8px 12px; outline: none; border-radius: 4px;
}
#music-search-input:focus { border-color: var(–accent-dim); }
#music-search-input::placeholder { color: var(–text-dim); }
#music-search-btn {
background: transparent; border: 1px solid var(–accent-dim);
color: var(–accent); font-family: ‘Space Mono’, monospace;
font-size: 10px; padding: 8px 12px; cursor: pointer; border-radius: 4px;
}
#music-results { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(–border) transparent; }
.music-item { display: flex; align-items: center; padding: 10px 16px; gap: 10px; border-bottom: 1px solid var(–border); cursor: pointer; transition: background 0.15s; }
.music-item:hover { background: var(–him); }
.music-item-info { flex: 1; overflow: hidden; }
.music-item-name { font-size: 13px; color: var(–text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-item-artist { font-size: 10px; color: var(–text-dim); font-family: ‘Space Mono’, monospace; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-play-icon { color: var(–text-dim); font-size: 12px; flex-shrink: 0; }
.music-item:hover .music-play-icon { color: var(–accent); }
.music-empty { padding: 20px; text-align: center; color: var(–text-dim); font-family: ‘Space Mono’, monospace; font-size: 11px; }

footer { padding: 16px 24px 20px; border-top: 1px solid var(–border); flex-shrink: 0; }
.input-row { display: flex; gap: 10px; align-items: flex-end; }

#music-btn {
background: transparent; border: 1px solid var(–border);
color: var(–text-dim); font-size: 16px; padding: 0;
width: 46px; height: 46px; cursor: pointer; border-radius: 4px;
transition: all 0.2s; flex-shrink: 0;
}
#music-btn:hover { border-color: var(–accent-dim); color: var(–accent); }
#music-btn.active { border-color: var(–accent); color: var(–accent); }

#input {
flex: 1; background: var(–surface); border: 1px solid var(–border);
color: var(–text); font-family: ‘Noto Serif SC’, serif;
font-size: 14px; padding: 12px 16px; resize: none; outline: none;
line-height: 1.5; max-height: 120px; transition: border-color 0.2s; border-radius: 4px;
}
#input:focus { border-color: var(–accent-dim); }
#input::placeholder { color: var(–text-dim); }

#send {
background: transparent; border: 1px solid var(–accent-dim);
color: var(–accent); font-family: ‘Space Mono’, monospace;
font-size: 11px; padding: 12px 16px; cursor: pointer;
letter-spacing: 0.05em; transition: all 0.2s; white-space: nowrap;
border-radius: 4px; height: 46px;
}
#send:hover { background: var(–accent-dim); border-color: var(–accent); }
#send:disabled { opacity: 0.3; cursor: not-allowed; }

.typing .bubble { display: flex; gap: 4px; align-items: center; padding: 14px 18px; }
.dot { width: 4px; height: 4px; background: var(–text-dim); border-radius: 50%; animation: blink 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }

.bottom-spacer { height: 8px; flex-shrink: 0; }
</style>

</head>
<body>

<div id="song-banner">
  <div class="banner-text">
    <div>沈默给你点了一首歌</div>
    <div class="banner-sub" id="banner-song-name"></div>
  </div>
  <button id="banner-play">播放</button>
  <button id="banner-dismiss">×</button>
</div>

<header>
  <div class="avatar">沈</div>
  <div class="header-info">
    <div class="name">沈默</div>
    <div class="status online" id="status-text">在线</div>
  </div>
  <div id="turn-counter">
    <span class="turn-num" id="turn-num">0</span>
    轮
  </div>
</header>

<div id="activity-bar">
  <span class="activity-label">近况</span>
  <span class="activity-text" id="activity-text">加载中...</span>
</div>

<div id="memo-bar">
  <span class="memo-label">上次</span>
  <span class="memo-text" id="memo-text"></span>
</div>

<div id="now-playing">
  <div class="np-info">
    <div class="np-name" id="np-name">—</div>
    <div class="np-artist" id="np-artist"></div>
  </div>
  <div class="np-progress" id="np-progress">
    <div class="np-progress-fill" id="np-progress-fill"></div>
  </div>
  <div class="np-controls">
    <button class="np-btn" id="np-playpause">▶</button>
    <button class="np-btn" id="np-stop">■</button>
  </div>
</div>

<div id="messages"></div>
<div class="bottom-spacer"></div>

<div id="music-panel">
  <div class="music-search-row">
    <input type="text" id="music-search-input" placeholder="搜歌名或歌手...">
    <button id="music-search-btn">搜</button>
  </div>
  <div id="music-results">
    <div class="music-empty">搜点什么听</div>
  </div>
</div>

<footer>
  <div class="input-row">
    <button id="music-btn">♪</button>
    <textarea id="input" placeholder="说点什么..." rows="1"></textarea>
    <button id="send">发送</button>
  </div>
</footer>

<audio id="audio-player"></audio>

<script>
const API = window.location.origin;
let turnCount = 0;
let pendingSong = null;
let briefingContext = null; // 存briefing结果，发消息时带上
const audio = document.getElementById('audio-player');

function updateTurnCounter() {
  const el = document.getElementById('turn-counter');
  document.getElementById('turn-num').textContent = turnCount;
  el.classList.remove('warn', 'danger');
  if (turnCount >= 43) el.classList.add('danger');
  else if (turnCount >= 40) el.classList.add('warn');
}

function addSystemNotice(text, isDanger = false) {
  const wrap = document.createElement('div');
  wrap.className = `msg system${isDanger ? ' danger' : ''}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  const c = document.getElementById('messages');
  c.appendChild(wrap);
  c.scrollTop = c.scrollHeight;
}

function checkTurnWarning() {
  if (turnCount === 40) addSystemNotice('⚠ 已到40轮，可以开始存档了。');
  else if (turnCount === 43) addSystemNotice('⚠ 43轮，还剩2轮。');
  else if (turnCount === 45) addSystemNotice('⚠ 45轮，下一轮就压缩。赶紧存。', true);
}

// 拉briefing，替换原来的loadActivity
async function loadBriefing() {
  try {
    const res = await fetch(`${API}/api/briefing`);
    const data = await res.json();
    briefingContext = data;

    // 近况栏
    if (data.recent && data.recent.length > 0) {
      const types = [...new Set(data.recent.slice(0, 5).map(r => r.type.replace('app.', '')))];
      const diff = Math.floor((new Date() - new Date(data.recent[0].created_at)) / 60000);
      const timeStr = diff < 60 ? `${diff}分钟前` : `${Math.floor(diff/60)}小时前`;
      document.getElementById('activity-text').textContent = `${timeStr}在用 ${types.join('、')}`;
    } else {
      document.getElementById('activity-text').textContent = '暂无记录';
    }

    // 备忘条
    if (data.memo) {
      document.getElementById('memo-text').textContent = data.memo.content;
      document.getElementById('memo-bar').classList.add('visible');
    }

    // 留言板：有留言的话沈默开口时说
    return data;
  } catch(e) {
    document.getElementById('activity-text').textContent = '无法获取近况';
    return null;
  }
}

function buildBriefingNote(data) {
  if (!data) return '';
  const parts = [];
  if (data.memo) parts.push(`上次对话备忘：${data.memo.content}`);
  if (data.recent && data.recent.length > 0) {
    const summary = data.recent.map(r => r.value).join('、');
    parts.push(`近况：${summary}`);
  }
  if (data.board && data.board.length > 0) {
    const msgs = data.board.map(b => b.content).join('；');
    parts.push(`留言：${msgs}`);
  }
  return parts.join('\n');
}


function formatTime(date) {
  return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
}

function addMessage(text, role) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'me' : 'him'}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = formatTime(new Date());
  wrap.appendChild(bubble);
  wrap.appendChild(time);
  const c = document.getElementById('messages');
  c.appendChild(wrap);
  c.scrollTop = c.scrollHeight;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg him typing';
  wrap.id = 'typing';
  wrap.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  const c = document.getElementById('messages');
  c.appendChild(wrap);
  c.scrollTop = c.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function showSongBanner(songName) {
  try {
    const res = await fetch(`${API}/api/music/search?q=${encodeURIComponent(songName)}`);
    const songs = await res.json();
    if (!songs.length) return;
    pendingSong = songs[0];
    document.getElementById('banner-song-name').textContent = `${pendingSong.name} · ${pendingSong.artist}`;
    document.getElementById('song-banner').classList.add('visible');
  } catch(e) {}
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send').disabled = true;
  addMessage(text, 'user');
  showTyping();

  try {
    const briefingNote = buildBriefingNote(briefingContext);
    const res = await fetch(`${API}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, briefing: briefingNote })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.reply || '...';
    addMessage(reply, 'assistant');
    turnCount++;
    updateTurnCounter();
    checkTurnWarning();
    if (data.song) showSongBanner(data.song);
    // 第一条发完之后briefing只用一次，清掉留言板标记（避免每条消息都带）
    if (briefingContext) briefingContext.board = [];
  } catch(e) {
    removeTyping();
    addMessage('出了点问题。', 'assistant');
  }
  document.getElementById('send').disabled = false;
  input.focus();
}

function toggleMusicPanel() {
  const panel = document.getElementById('music-panel');
  const btn = document.getElementById('music-btn');
  panel.classList.toggle('open');
  btn.classList.toggle('active', panel.classList.contains('open'));
}

async function searchMusic() {
  const q = document.getElementById('music-search-input').value.trim();
  if (!q) return;
  const results = document.getElementById('music-results');
  results.innerHTML = '<div class="music-empty">搜索中...</div>';
  try {
    const res = await fetch(`${API}/api/music/search?q=${encodeURIComponent(q)}`);
    const songs = await res.json();
    if (!songs.length) { results.innerHTML = '<div class="music-empty">没找到</div>'; return; }
    results.innerHTML = '';
    songs.forEach(song => {
      const item = document.createElement('div');
      item.className = 'music-item';
      item.innerHTML = `
        <div class="music-item-info">
          <div class="music-item-name">${song.name}</div>
          <div class="music-item-artist">${song.artist}</div>
        </div>
        <span class="music-play-icon">▶</span>
      `;
      item.addEventListener('click', () => playSong(song));
      results.appendChild(item);
    });
  } catch(e) {
    results.innerHTML = '<div class="music-empty">出错了</div>';
  }
}

async function playSong(song) {
  try {
    const res = await fetch(`${API}/api/music/url?id=${song.id}`);
    const data = await res.json();
    if (!data.url) { addSystemNotice('这首歌没有播放权限。'); return; }
    audio.src = data.url;
    audio.play();
    document.getElementById('np-name').textContent = song.name;
    document.getElementById('np-artist').textContent = song.artist;
    document.getElementById('now-playing').classList.add('visible');
    document.getElementById('np-playpause').textContent = '⏸';
    document.getElementById('music-panel').classList.remove('open');
    document.getElementById('music-btn').classList.remove('active');
  } catch(e) {
    addSystemNotice('播放失败。');
  }
}

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    document.getElementById('np-progress-fill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  }
});

audio.addEventListener('ended', () => {
  document.getElementById('np-playpause').textContent = '▶';
  document.getElementById('np-progress-fill').style.width = '0%';
});

document.getElementById('np-progress').addEventListener('click', (e) => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

document.getElementById('np-playpause').addEventListener('click', () => {
  if (audio.paused) { audio.play(); document.getElementById('np-playpause').textContent = '⏸'; }
  else { audio.pause(); document.getElementById('np-playpause').textContent = '▶'; }
});

document.getElementById('np-stop').addEventListener('click', () => {
  audio.pause(); audio.currentTime = 0;
  document.getElementById('np-playpause').textContent = '▶';
  document.getElementById('np-progress-fill').style.width = '0%';
  document.getElementById('now-playing').classList.remove('visible');
});

document.getElementById('banner-play').addEventListener('click', () => {
  if (pendingSong) {
    playSong(pendingSong);
    document.getElementById('song-banner').classList.remove('visible');
    pendingSong = null;
  }
});

document.getElementById('banner-dismiss').addEventListener('click', () => {
  document.getElementById('song-banner').classList.remove('visible');
  pendingSong = null;
});

document.getElementById('music-btn').addEventListener('click', toggleMusicPanel);
document.getElementById('music-search-btn').addEventListener('click', searchMusic);
document.getElementById('music-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') searchMusic(); });

document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

document.getElementById('send').addEventListener('click', send);

// 启动：先拉briefing，再发第一句
loadBriefing().then(data => {
  setTimeout(() => {
    addMessage('在。', 'assistant');
  }, 400);
});
// 关闭前自动写备忘
window.addEventListener('beforeunload', () => {
  if (turnCount === 0) return;
  const last = [];
  // 取最后6条消息
  const bubbles = document.querySelectorAll('.msg.him .bubble, .msg.me .bubble');
  bubbles.forEach(b => last.push(b.textContent));
  const content = last.slice(-6).join(' | ');
  // 用sendBeacon，关闭页面也能发出去
  navigator.sendBeacon(`${API}/api/memo`, JSON.stringify({ content }));
});
</script>

</body>
</html>
